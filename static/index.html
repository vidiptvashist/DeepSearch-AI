<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSearch AI</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="//unpkg.com/react-force-graph-2d"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        dark: { bg: '#09090b', surface: '#18181b', border: '#27272a' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e4e4e7;
            border-radius: 3px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #3f3f46;
        }

        .markdown-content p {
            margin-bottom: 0.6em;
            line-height: 1.6;
        }

        .markdown-content p:last-child {
            margin-bottom: 0;
        }

        .markdown-content ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 0.6em;
        }

        .markdown-content ol {
            list-style-type: decimal;
            padding-left: 1.5em;
            margin-bottom: 0.6em;
        }

        .markdown-content strong {
            font-weight: 600;
            color: inherit;
        }

        .markdown-content code {
            background: rgba(100, 116, 139, 0.1);
            padding: 0.2em 0.4em;
            border-radius: 0.3em;
            font-family: monospace;
            font-size: 0.9em;
        }

        .dark .markdown-content code {
            background: rgba(255, 255, 255, 0.1);
        }

        .markdown-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1em 0;
        }

        .loader {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid currentColor;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-white dark:bg-dark-bg text-zinc-900 dark:text-zinc-100 transition-colors duration-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useLayoutEffect } = React;
        const ForceGraph2D = window.ForceGraph2D;

        // --- CONFIG ---
        const SUPABASE_URL = 'https://yeufqxpqibeuvcunzyeo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlldWZxeHBxaWJldXZjdW56eWVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxNTM1MDgsImV4cCI6MjA3ODcyOTUwOH0.8AUu8y9izVvCcHXNHDvJtVLXQPjr_aNqnVSsWTI2E90';
        const API_BASE_URL = window.location.protocol === 'file:' ? 'http://localhost:8000' : window.location.origin;

        // --- ICONS ---
        const Icon = ({ children, className = "", onClick }) => <svg className={className} onClick={onClick} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
        const SendIcon = (props) => <Icon {...props}><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></Icon>;
        const PlusIcon = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
        const TrashIcon = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></Icon>;
        const DatabaseIcon = (props) => <Icon {...props}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></Icon>;
        const SidebarIcon = (props) => <Icon {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="9" y1="3" x2="9" y2="21" /></Icon>;
        const SunIcon = (props) => <Icon {...props}><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></Icon>;
        const MoonIcon = (props) => <Icon {...props}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></Icon>;
        const UploadIcon = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></Icon>;
        const FileIcon = (props) => <Icon {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><line x1="10" y1="9" x2="8" y2="9" /></Icon>;
        const RefreshIcon = (props) => <Icon {...props}><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></Icon>;
        const BookIcon = (props) => <Icon {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></Icon>;
        const ArrowLeftIcon = (props) => <Icon {...props}><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></Icon>;
        const SettingsIcon = (props) => <Icon {...props}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></Icon>;
        const SparklesIcon = (props) => <Icon {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></Icon>;
        const NetworkIcon = (props) => <Icon {...props}><circle cx="12" cy="12" r="3" /><circle cx="6" cy="6" r="3" /><circle cx="18" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="18" r="3" /><line x1="12" y1="12" x2="6" y2="6" /><line x1="12" y1="12" x2="18" y2="6" /><line x1="12" y1="12" x2="6" y2="18" /><line x1="12" y1="12" x2="18" y2="18" /></Icon>;

        // --- SUPABASE ---
        class SupabaseClient {
            constructor(url, key) { this.url = url; this.key = key; this.token = localStorage.getItem('sb_token'); this.userEmail = localStorage.getItem('sb_email'); }
            async signIn(email, password) { const res = await fetch(`${this.url}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': this.key }, body: JSON.stringify({ email, password }) }); const data = await res.json(); if (data.access_token) { this.saveSession(data.access_token, email); } return data; }
            async signUp(email, password) { const res = await fetch(`${this.url}/auth/v1/signup`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': this.key }, body: JSON.stringify({ email, password }) }); const data = await res.json(); if (data.access_token) { this.saveSession(data.access_token, email); } return data; }
            saveSession(token, email) { this.token = token; this.userEmail = email; localStorage.setItem('sb_token', token); localStorage.removeItem('sb_email'); }
            signOut() { this.token = null; this.userEmail = null; localStorage.removeItem('sb_token'); localStorage.removeItem('sb_email'); }
            getToken() { return this.token; }
            getEmail() { return this.userEmail; }
        }
        const supabase = new SupabaseClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- SUB COMPONENTS ---
        const ThemeToggle = ({ darkMode, setDarkMode, className = "" }) => (
            <button
                onClick={() => setDarkMode(!darkMode)}
                className={`p-2 rounded-lg transition text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/10 ${className}`}
                title="Toggle Theme"
            >
                {darkMode ? <SunIcon /> : <MoonIcon />}
            </button>
        );

        // --- MAIN APP ---
        function App() {
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved !== null ? JSON.parse(saved) : true;
            });
            const [view, setView] = useState('landing'); // 'landing' | 'auth' | 'app' | 'release_notes'
            const [user, setUser] = useState(null);

            const [authMode, setAuthMode] = useState('signin');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const [stores, setStores] = useState([]);
            const [selectedStore, setSelectedStore] = useState(null);
            const [documents, setDocuments] = useState([]);
            const [messages, setMessages] = useState([]);
            const [query, setQuery] = useState('');

            const [chatLoading, setChatLoading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(false);

            const [leftSidebarOpen, setLeftSidebarOpen] = useState(true);
            const [rightSidebarOpen, setRightSidebarOpen] = useState(true);
            const [newStoreName, setNewStoreName] = useState('');

            const [showSettings, setShowSettings] = useState(false);
            const [systemPrompt, setSystemPrompt] = useState('');
            const [enhancing, setEnhancing] = useState(false);

            const [viewMode, setViewMode] = useState('chat'); // 'chat' | 'graph'
            const [graphData, setGraphData] = useState({ nodes: [], links: [] });
            const [graphLoading, setGraphLoading] = useState(false);

            const chatEndRef = useRef(null);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
                localStorage.setItem('darkMode', JSON.stringify(darkMode));
            }, [darkMode]);

            useEffect(() => {
                const token = supabase.getToken();
                if (token) {
                    setUser({ token, email: supabase.getEmail() });
                    setView('app');
                    loadStores();
                }
            }, []);

            useLayoutEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, loading, chatLoading]);

            const apiCall = async (endpoint, options = {}) => {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, {
                    ...options,
                    headers: { ...options.headers, 'Authorization': `Bearer ${supabase.getToken()}` }
                });
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            };

            // --- ACTIONS ---

            const handleAuth = async () => {
                if (!email || !password) return alert('Please fill in all fields');
                setLoading(true);
                try {
                    const data = authMode === 'signin' ? await supabase.signIn(email, password) : await supabase.signUp(email, password);
                    if (data.access_token) {
                        setUser({ token: data.access_token, email });
                        setView('app');
                        loadStores();
                    } else alert(data.error_description || 'Authentication failed');
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            const handleLogout = () => {
                supabase.signOut();
                setUser(null);
                setView('landing');
                setStores([]);
                setSelectedStore(null);
            };

            const loadStores = async () => { try { setStores((await apiCall('/api/stores')).stores || []); } catch (e) { console.error(e); } };

            const selectStore = async (store) => {
                setSelectedStore(store);
                setMessages([]);
                setChatLoading(true);
                setViewMode('chat');
                setGraphData({ nodes: [], links: [] });

                // Load system prompt for this store
                const savedPrompt = localStorage.getItem(`sys_prompt_${store.display_name}`);
                setSystemPrompt(savedPrompt || "");

                Promise.all([
                    apiCall(`/api/stores/${encodeURIComponent(store.display_name)}/documents`),
                    apiCall(`/api/stores/${encodeURIComponent(store.display_name)}/chat`)
                ]).then(([docsData, chatData]) => {
                    setDocuments(docsData.documents || []);
                    setMessages(chatData.history || []);
                }).catch(e => console.error(e))
                    .finally(() => setChatLoading(false));

                if (window.innerWidth < 768) setLeftSidebarOpen(false);
            };

            const handleQuery = async (txt = query) => {
                if (!txt.trim() || !selectedStore) return;
                const userMsg = { role: 'user', content: txt };
                setMessages(prev => [...prev, userMsg]);
                setQuery('');
                setLoading(true);

                try {
                    const data = await apiCall(`/api/stores/${encodeURIComponent(selectedStore.display_name)}/query`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: txt, system_instruction: systemPrompt })
                    });
                    setMessages(prev => [...prev, { role: 'model', content: data.result, suggestions: data.suggestions, citations: data.citations }]);
                } catch (e) {
                    setMessages(prev => [...prev, { role: 'model', content: 'Error: ' + e.message, isError: true }]);
                }
                setLoading(false);
            };

            // Store & Doc Actions
            const createStore = async () => {
                if (!newStoreName.trim()) return;
                try { await apiCall('/api/stores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ display_name: newStoreName }) }); setNewStoreName(''); loadStores(); } catch (e) { alert('Failed to create store'); }
            };
            const deleteStore = async (name) => { if (!confirm(`Delete ${name}?`)) return; try { await apiCall(`/api/stores/${encodeURIComponent(name)}`, { method: 'DELETE' }); loadStores(); if (selectedStore?.display_name === name) setSelectedStore(null); } catch (e) { alert('Delete failed'); } };
            const uploadFile = async (e) => {
                const file = e.target.files?.[0]; if (!file || !selectedStore) return;
                setUploadProgress(true); const fd = new FormData(); fd.append('file', file);
                try {
                    await fetch(`${API_BASE_URL}/api/stores/${encodeURIComponent(selectedStore.display_name)}/upload`, { method: 'POST', headers: { 'Authorization': `Bearer ${supabase.getToken()}` }, body: fd });
                    const docsData = await apiCall(`/api/stores/${encodeURIComponent(selectedStore.display_name)}/documents`); setDocuments(docsData.documents || []);
                } catch (e) { alert('Upload failed'); } setUploadProgress(false); e.target.value = '';
            };
            const deleteDocument = async (docName) => { if (!confirm("Delete doc?")) return; try { await apiCall(`/api/stores/${encodeURIComponent(selectedStore.display_name)}/documents`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ document_resource_name: docName }) }); const docsData = await apiCall(`/api/stores/${encodeURIComponent(selectedStore.display_name)}/documents`); setDocuments(docsData.documents || []); } catch (e) { alert("Failed to delete doc"); } };

            const handleEnhancePrompt = async () => {
                if (!systemPrompt.trim()) return;
                setEnhancing(true);
                try {
                    const res = await apiCall('/api/enhance_prompt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: systemPrompt }) });
                    setSystemPrompt(res.enhanced_prompt);
                } catch (e) { alert("Enhancement failed"); }
                setEnhancing(false);
            };

            const saveSettings = () => {
                if (selectedStore) {
                    localStorage.setItem(`sys_prompt_${selectedStore.display_name}`, systemPrompt);
                }
                setShowSettings(false);
            };

            const toggleViewMode = async () => {
                const newMode = viewMode === 'chat' ? 'graph' : 'chat';
                setViewMode(newMode);
                if (newMode === 'graph' && graphData.nodes.length === 0) {
                    setGraphLoading(true);
                    try {
                        const data = await apiCall(`/api/stores/${encodeURIComponent(selectedStore.display_name)}/graph`);
                        setGraphData(data);
                    } catch (e) { alert("Failed to load graph"); setViewMode('chat'); }
                    setGraphLoading(false);
                }
            };


            // --- RENDER VIEWS ---

            if (view === 'landing') {
                return (
                    <div className="min-h-screen bg-white dark:bg-dark-bg text-zinc-900 dark:text-white transition-colors relative font-sans flex flex-col">
                        <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 pointer-events-none"></div>
                        <nav className="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between relative z-10 w-full">
                            <div className="flex items-center gap-2">
                                <div className="w-9 h-9 bg-gradient-to-tr from-brand-600 to-brand-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-brand-500/20"><DatabaseIcon className="w-5 h-5" /></div>
                                <span className="text-xl font-bold tracking-tight">DeepSearch</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <ThemeToggle darkMode={darkMode} setDarkMode={setDarkMode} />
                                <button onClick={() => setView('auth')} className="px-5 py-2.5 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 font-medium rounded-lg hover:opacity-90 transition shadow-md">Sign In</button>
                            </div>
                        </nav>
                        <main className="flex-1 flex flex-col items-center justify-center px-6 pb-20 text-center relative z-10">
                            <div className="bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-300 px-4 py-1.5 rounded-full text-xs font-semibold mb-8 border border-brand-100 dark:border-brand-800/50 animate-fade-in">
                                v2.75 • Persistent Memory & Smart Citations
                            </div>
                            <h1 className="text-5xl md:text-7xl font-bold tracking-tight mb-8 text-zinc-900 dark:text-white max-w-4xl leading-tight">
                                Transform your documents into <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-purple-600 dark:from-brand-400 dark:to-purple-400">intelligent insights</span>
                            </h1>
                            <p className="text-lg text-zinc-600 dark:text-zinc-400 mb-12 max-w-2xl mx-auto leading-relaxed">
                                DeepSearch acts as your dedicated research assistant. Upload Documents, ask complex questions, and get answers backed by cited sources and conversation history.
                            </p>
                            <button onClick={() => setView('auth')} className="px-8 py-4 bg-brand-600 text-white rounded-xl font-semibold shadow-xl shadow-brand-600/20 hover:bg-brand-700 transition-all hover:-translate-y-1 flex items-center gap-2">
                                Start Researching <SendIcon className="w-4 h-4" />
                            </button>
                        </main>
                        <footer className="p-6 text-center relative z-10">
                            <button onClick={() => setView('release_notes')} className="text-sm text-zinc-500 hover:text-brand-600 dark:text-zinc-400 dark:hover:text-brand-400 transition font-medium">
                                What's New in v2.75?
                            </button>
                        </footer>
                    </div>
                );
            }

            if (view === 'release_notes') {
                return (
                    <div className="h-screen overflow-y-auto bg-zinc-50 dark:bg-dark-bg text-zinc-900 dark:text-white p-6 md:p-12 font-sans">
                        <div className="max-w-3xl mx-auto">
                            <div className="mb-12 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-gradient-to-tr from-brand-600 to-brand-500 rounded-xl flex items-center justify-center text-white shadow-lg"><DatabaseIcon className="w-5 h-5" /></div>
                                    <h1 className="text-2xl font-bold">Release Notes</h1>
                                </div>
                                <button onClick={() => setView('landing')} className="px-4 py-2 bg-white dark:bg-white/5 border border-zinc-200 dark:border-dark-border rounded-lg text-sm font-medium hover:bg-zinc-50 dark:hover:bg-white/10 transition">Back to Home</button>
                            </div>

                            <div className="space-y-12 relative before:absolute before:inset-y-0 before:left-4 md:before:left-[8.5rem] before:w-0.5 before:bg-zinc-200 dark:before:bg-zinc-800">

                                {/* v2.75 */}

                                            const fontSize = 12 / globalScale;

                                            const textWidth = ctx.measureText(label).width;

                                            ctx.beginPath();
                                            const r = node.val ? Math.sqrt(node.val) * 2 : 4;

                                <button onClick={() => setRightSidebarOpen(false)} className="lg:hidden text-zinc-400 hover:text-zinc-600"><Icon><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon></button>
                            </div>

                            <div className="p-5 border-b border-zinc-200 dark:border-dark-border shrink-0">
                                <label className={`flex flex-col items-center justify-center w-full h-28 rounded-xl border-2 border-dashed cursor-pointer transition group ${uploadProgress ? 'border-brand-400 bg-brand-50 dark:bg-brand-900/20' : 'border-zinc-300 dark:border-dark-border hover:border-brand-400 dark:hover:border-brand-500 hover:bg-zinc-50 dark:hover:bg-white/5'}`}>
                                    {uploadProgress ? (
                                        <div className="loader text-brand-500"></div>
                                    ) : (
                                        <>
                                            <div className="p-2 bg-zinc-100 dark:bg-white/5 rounded-lg group-hover:scale-110 transition duration-200 mb-2"><UploadIcon className="w-5 h-5 text-zinc-400 group-hover:text-brand-500" /></div>
                                            <span className="text-xs font-semibold text-zinc-600 dark:text-zinc-400 group-hover:text-brand-600 dark:group-hover:text-brand-400">Click to Upload Documents</span>
                                        </>
                                    )}
                                    <input type="file" onChange={uploadFile} className="hidden" disabled={uploadProgress} />
                                </label>
                            </div>

                            <div className="flex-1 overflow-y-auto p-3 space-y-2">
                                {documents.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-40 text-center text-zinc-400 px-6">
                                        <p className="text-xs mb-2">No documents yet.</p>
                                        <p className="text-[10px] opacity-70">Upload files to start searching context.</p>
                                    </div>
                                ) : (
                                    documents.map(doc => (
                                        <div key={doc.resource_name} className="group p-3 bg-white dark:bg-dark-bg border border-zinc-200 dark:border-dark-border rounded-xl hover:border-brand-300 dark:hover:border-brand-700 hover:shadow-md transition flex items-start gap-3 relative">
                                            <div className="p-2 bg-brand-50 dark:bg-brand-900/20 rounded-lg text-brand-600 dark:text-brand-400 shrink-0"><FileIcon className="w-4 h-4" /></div>
                                            <div className="min-w-0 flex-1">
                                                <p className="text-sm font-semibold text-zinc-700 dark:text-zinc-200 truncate leading-tight" title={doc.display_name}>{doc.display_name}</p>
                                                <p className="text-[10px] text-zinc-400 uppercase mt-1 tracking-wide font-medium">{doc.mime_type.split('/')[1]}</p>
                                            </div>
                                            <button onClick={() => deleteDocument(doc.resource_name)} className="opacity-0 group-hover:opacity-100 absolute top-2 right-2 p-1.5 text-zinc-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-white/5 rounded-md transition"><TrashIcon className="w-3.5 h-3.5" /></button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </aside>
                    )}

                    {/* SETTINGS MODAL */}
                    {showSettings && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                            <div className="w-full max-w-lg bg-white dark:bg-dark-surface rounded-2xl shadow-2xl border border-zinc-200 dark:border-dark-border overflow-hidden animate-slide-up">
                                <div className="p-6 border-b border-zinc-200 dark:border-dark-border flex justify-between items-center">
                                    <h3 className="text-lg font-bold dark:text-white">Workspace Settings</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200"><Icon><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon></button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">System Prompt</label>
                                        <div className="relative">
                                            <textarea
                                                value={systemPrompt}
                                                onChange={e => setSystemPrompt(e.target.value)}
                                                className="w-full h-40 p-4 rounded-xl bg-zinc-50 dark:bg-black/20 border border-zinc-200 dark:border-dark-border dark:text-white focus:ring-2 focus:ring-brand-500 outline-none resize-none text-sm leading-relaxed"
                                                placeholder="e.g., You are a helpful assistant. Answer concisely."
                                            />
                                            <button
                                                onClick={handleEnhancePrompt}
                                                disabled={enhancing || !systemPrompt.trim()}
                                                className="absolute bottom-3 right-3 px-3 py-1.5 bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 text-xs font-semibold rounded-lg hover:bg-brand-200 dark:hover:bg-brand-900/60 transition flex items-center gap-1.5 disabled:opacity-50"
                                            >
                                                {enhancing ? <div className="loader w-3 h-3 border-brand-600" /> : <SparklesIcon className="w-3.5 h-3.5" />}
                                                Enhance
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-2 uppercase tracking-wider">Sample Prompts</label>
                                        <div className="flex flex-wrap gap-2">
                                            {["Summarize concisely", "Explain like I'm 5", "Detailed analysis", "Code expert"].map(p => (
                                                <button key={p} onClick={() => setSystemPrompt(p)} className="px-3 py-1.5 rounded-full border border-zinc-200 dark:border-dark-border text-xs text-zinc-600 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-white/5 transition">{p}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="p-6 border-t border-zinc-200 dark:border-dark-border bg-zinc-50 dark:bg-black/20 flex justify-end gap-3">
                                    <button onClick={() => setShowSettings(false)} className="px-4 py-2 text-zinc-600 dark:text-zinc-300 font-medium hover:bg-zinc-200 dark:hover:bg-white/10 rounded-lg transition">Cancel</button>
                                    <button onClick={saveSettings} className="px-6 py-2 bg-brand-600 text-white font-bold rounded-lg hover:bg-brand-700 transition shadow-lg shadow-brand-600/20">Save Changes</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
