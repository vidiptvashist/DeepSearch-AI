        const Database = (props) => <Icon {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></Icon>;

        const Menu = (props) => <Icon {...props}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></Icon>;
        const X = (props) => <Icon {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
        const Sun = (props) => <Icon {...props}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></Icon>;
        const Moon = (props) => <Icon {...props}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></Icon>;

        class SupabaseClient {
            constructor(url, key) {
                this.url = url;
                this.key = key;
                this.token = localStorage.getItem('sb_token');
                this.userEmail = localStorage.getItem('sb_email');
            }

            async signUp(email, password) {
                const res = await fetch(`${this.url}/auth/v1/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': this.key },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.access_token) {
                    this.token = data.access_token;
                    this.userEmail = email;
                    localStorage.setItem('sb_token', data.access_token);
                    localStorage.setItem('sb_email', email);
                }
                return data;
            }

            async signIn(email, password) {
                const res = await fetch(`${this.url}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': this.key },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.access_token) {
                    this.token = data.access_token;
                    this.userEmail = email;
                    localStorage.setItem('sb_token', data.access_token);
                    localStorage.setItem('sb_email', email);
                }
                return data;
            }

            signOut() {
                this.token = null;
                this.userEmail = null;
                localStorage.removeItem('sb_token');
                localStorage.removeItem('sb_email');
            }

            getToken() {
                return this.token;
            }

            getEmail() {
                return this.userEmail;
            }
        }

        const supabase = new SupabaseClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved ? JSON.parse(saved) : false;
            });
            const [showLanding, setShowLanding] = useState(true);
            const [user, setUser] = useState(null);
            const [authMode, setAuthMode] = useState('signin');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [stores, setStores] = useState([]);
            const [selectedStore, setSelectedStore] = useState(null);
            const [documents, setDocuments] = useState([]);
            const [query, setQuery] = useState('');
            const [queryResult, setQueryResult] = useState('');
            const [newStoreName, setNewStoreName] = useState('');
            const [loading, setLoading] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [uploadProgress, setUploadProgress] = useState(false);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('darkMode', JSON.stringify(darkMode));
            }, [darkMode]);

            useEffect(() => {
                const token = supabase.getToken();
                const userEmail = supabase.getEmail();
                if (token && userEmail) {
                    setUser({ token, email: userEmail });
                    setShowLanding(false);
                    loadStores();
                }
            }, []);

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
            };

            const handleAuth = async () => {
                setLoading(true);
                try {
                    const data = authMode === 'signin' 
                        ? await supabase.signIn(email, password)
                        : await supabase.signUp(email, password);
                    
                    if (data.access_token) {
                        setUser({ token: data.access_token, email });
                        setShowLanding(false);
                        loadStores();
                    } else {
                        alert(data.error_description || 'Authentication failed');
                    }
                } catch (err) {
                    alert('Error: ' + err.message);
                }
                setLoading(false);
            };

            const handleLogout = () => {
                supabase.signOut();
                setUser(null);
                setStores([]);
                setSelectedStore(null);
                setDocuments([]);
            };

            const apiCall = async (endpoint, options = {}) => {
                const token = supabase.getToken();
                const res = await fetch(`${API_BASE_URL}${endpoint}`, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!res.ok) throw new Error('API call failed');
                return res.json();
            };

            const loadStores = async () => {
                try {
                    const data = await apiCall('/api/stores');
                    setStores(data.stores || []);
                } catch (err) {
                    console.error('Failed to load stores:', err);
                }
            };

            const createStore = async () => {
                if (!newStoreName.trim()) return;
                setLoading(true);
                try {
                    await apiCall('/api/stores', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ display_name: newStoreName })
                    });
                    setNewStoreName('');
                    loadStores();
                } catch (err) {
                    alert('Failed to create store');
                }
                setLoading(false);
            };

            const deleteStore = async (displayName) => {
                if (!confirm(`Delete store "${displayName}"?`)) return;
                try {
                    await apiCall(`/api/stores/${encodeURIComponent(displayName)}`, {
                        method: 'DELETE'
                    });
                    if (selectedStore?.display_name === displayName) {
                        setSelectedStore(null);
                        setDocuments([]);
                    }
                    loadStores();
                } catch (err) {
                    alert('Failed to delete store');
                }
            };

            const selectStore = async (store) => {
                setSelectedStore(store);
                setQueryResult('');
                try {
                    const data = await apiCall(`/api/stores/${encodeURIComponent(store.display_name)}/documents`);
                    setDocuments(data.documents || []);
                } catch (err) {
                    console.error('Failed to load documents:', err);
                }
            };

            const uploadFile = async (e) => {
                const file = e.target.files?.[0];
                if (!file || !selectedStore) return;
                
                setUploadProgress(true);
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const token = supabase.getToken();
                    await fetch(`${API_BASE_URL}/api/stores/${encodeURIComponent(selectedStore.display_name)}/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    selectStore(selectedStore);
                } catch (err) {
                    alert('Upload failed');
                }
                setUploadProgress(false);
                e.target.value = '';
            };

            const deleteDocument = async (docResourceName) => {
                if (!confirm('Delete this document?')) return;
                try {
                    await apiCall(`/api/stores/${encodeURIComponent(selectedStore.display_name)}/documents`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ document_resource_name: docResourceName })
                    });
                    selectStore(selectedStore);
                } catch (err) {
                    alert('Failed to delete document');
                }
            };

            const handleQuery = async () => {
                if (!query.trim() || !selectedStore) return;
                
                setLoading(true);
                try {
                    const data = await apiCall(`/api/stores/${encodeURIComponent(selectedStore.display_name)}/query`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });
                    setQueryResult(data.result || 'No results found');
                } catch (err) {
                    setQueryResult('Query failed: ' + err.message);
                }
                setLoading(false);
            };

            const handleKeyPress = (e, action) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    action();
                }
            };

            if (!user) {
                if (showLanding) {
                    return (
                        <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-white'} transition-colors`}>
                            {/* Navigation */}
                            <nav className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border-b sticky top-0 z-50`}>
                                <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center">
                                            <Database className="w-6 h-6 text-white" />
                                        </div>
                                        <span className={`text-xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'}`}>DeepSearch AI</span>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <button
                                            onClick={toggleDarkMode}
                                            className={`p-2 rounded-lg ${darkMode ? 'bg-gray-700 text-yellow-400' : 'bg-gray-100 text-gray-600'} hover:opacity-80 transition`}
                                        >
                                            {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                                        </button>
                                        <button
                                            onClick={() => setShowLanding(false)}
                                            className="px-6 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg font-medium hover:from-indigo-700 hover:to-purple-700 transition"
                                        >
                                            Get Started
                                        </button>
                                    </div>
                                </div>
                            </nav>

                            {/* Hero Section */}
                            <section className="max-w-7xl mx-auto px-6 py-20 text-center">
                                <div className="mb-8">
                                    <span className={`inline-block px-4 py-2 rounded-full text-sm font-medium ${darkMode ? 'bg-indigo-900 text-indigo-300' : 'bg-indigo-100 text-indigo-600'} mb-6`}>
                                        AI-Powered Document Intelligence
                                    </span>
                                </div>
                                <h1 className={`text-5xl md:text-7xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'} mb-6`}>
                                    Transform Your Internal Documents<br />
                                    Into <span className="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Intelligent Insights</span>
                                </h1>
                                <p className={`text-xl ${darkMode ? 'text-gray-400' : 'text-gray-600'} mb-10 max-w-3xl mx-auto`}>
                                    Upload your documents, ask questions in natural language, and get instant, accurate answers powered by advanced AI technology.
                                </p>
                                <div className="flex items-center justify-center gap-4">
                                    <button
                                        onClick={() => setShowLanding(false)}
                                        className="px-8 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl font-semibold text-lg hover:from-indigo-700 hover:to-purple-700 transition shadow-lg shadow-indigo-500/50"
                                    >
                                        Start Free Trial
                                    </button>

                                </div>
                            </section>

                            {/* Features Grid */}
                            <section className={`${darkMode ? 'bg-gray-800' : 'bg-gray-50'} py-20`}>
                                <div className="max-w-7xl mx-auto px-6">
                                    <div className="text-center mb-16">
                                        <h2 className={`text-4xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'} mb-4`}>
                                            Powerful Features for Deep Research
                                        </h2>
                                        <p className={`text-xl ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                            Everything you need to unlock insights from your documents
                                        </p>
                                    </div>
                                    
                                    <div className="grid md:grid-cols-3 gap-8">
                                        {[
                                            {
                                                icon: <Upload className="w-8 h-8 text-indigo-600" />,
                                                title: "Easy Upload",
                                                description: "Upload PDFs, Word docs, and text files in seconds. Supports multiple file formats."
                                            },
                                            {
                                                icon: <Search className="w-8 h-8 text-purple-600" />,
                                                title: "Natural Language Search",
                                                description: "Ask questions in plain English and get precise answers from your documents."
                                            },
                                            {
                                                icon: <Database className="w-8 h-8 text-indigo-600" />,

                                                description: "Create multiple document stores to keep your research organized by project or topic."
                                            },
                                            {
                                                icon: (
                                                    <svg className="w-8 h-8 text-purple-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                                                    </svg>
                                                ),
                                                title: "Lightning Fast",
                                                description: "Get instant answers with our optimized AI search engine. No waiting around."
                                            },
                                            {
                                                icon: (
                                                    <svg className="w-8 h-8 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                                    </svg>
                                                ),
                                                title: "Secure & Private",
                                                description: "Your documents are encrypted and secured. Only you have access to your data."
                                            },
                                            {
                                                icon: (
                                                    <svg className="w-8 h-8 text-purple-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                                    </svg>
                                                ),
                                                title: "Smart Analysis",
                                                description: "AI understands context and provides comprehensive answers with relevant citations."
                                            }
                                        ].map((feature, i) => (
                                            <div key={i} className={`p-6 ${darkMode ? 'bg-gray-900' : 'bg-white'} rounded-2xl shadow-lg`}>
                                                <div className="mb-4">{feature.icon}</div>
                                                <h3 className={`text-xl font-semibold ${darkMode ? 'text-white' : 'text-gray-900'} mb-2`}>
                                                    {feature.title}
                                                </h3>
                                                <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>
                                                    {feature.description}
                                                </p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            {/* How It Works */}
                            <section className="max-w-7xl mx-auto px-6 py-20">
                                <div className="text-center mb-16">
                                    <h2 className={`text-4xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'} mb-4`}>
                                        How It Works
                                    </h2>
                                    <p className={`text-xl ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                                        Start getting answers in three simple steps
                                    </p>
                                </div>
                                
                                <div className="grid md:grid-cols-3 gap-12">
                                    {[
                                        {
                                            step: "01",
                                            title: "Create a Store",
                                            description: "Set up a document store for your project. Organize research by topic or category."
                                        },
                                        {
                                            step: "02",
                                            title: "Upload Documents",
                                            description: "Drag and drop your files. We support PDFs, Word docs, text files, and more."
                                        },
                                        {
                                            step: "03",
                                            title: "Ask Questions",
                                            description: "Type your questions naturally. Get instant, accurate answers with source citations."
                                        }
                                    ].map((step, i) => (
                                        <div key={i} className="text-center">
                                            <div className="mb-6">
                                                <span className="inline-block w-16 h-16 rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-2xl font-bold flex items-center justify-center">
                                                    {step.step}
                                                </span>
                                            </div>
                                            <h3 className={`text-2xl font-semibold ${darkMode ? 'text-white' : 'text-gray-900'} mb-3`}>
                                                {step.title}
                                            </h3>
                                            <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>
                                                {step.description}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* CTA Section */}
                            <section className={`${darkMode ? 'bg-gradient-to-r from-gray-800 to-gray-900' : 'bg-gradient-to-r from-indigo-600 to-purple-600'} py-20`}>
                                <div className="max-w-4xl mx-auto px-6 text-center">
                                    <h2 className="text-4xl md:text-5xl font-bold text-white mb-6">
                                        Ready to Transform Your Research?
                                    </h2>
                                    <p className="text-xl text-indigo-100 mb-10">
                                        Join thousands of researchers, students, and professionals using DeepSearch AI
                                    </p>
                                    <button
                                        onClick={() => setShowLanding(false)}
                                        className={`px-10 py-4 ${darkMode ? 'bg-white text-gray-900' : 'bg-white text-indigo-600'} rounded-xl font-semibold text-lg hover:shadow-2xl transition transform hover:scale-105`}
                                    >
                                        Get Started Free
                                    </button>
                                </div>
                            </section>

                            {/* Footer */}
                            <footer className={`${darkMode ? 'bg-gray-900 border-gray-800' : 'bg-gray-50 border-gray-200'} border-t py-12`}>
                                <div className="max-w-7xl mx-auto px-6 text-center">
                                    <div className="flex items-center justify-center gap-3 mb-4">
                                        <div className="w-8 h-8 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center">
                                            <Database className="w-5 h-5 text-white" />
                                        </div>
                                        <span className={`text-lg font-bold ${darkMode ? 'text-white' : 'text-gray-900'}`}>DeepSearch AI</span>
                                    </div>
                                    <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>
                                        © 2025 DeepSearch AI. All rights reserved.
                                    </p>
                                </div>
                            </footer>
                        </div>
                    );
                }
                
                return (
                    <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gradient-to-br from-indigo-50 via-white to-purple-50'} flex items-center justify-center p-4`}>
                        <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-2xl shadow-xl p-8 w-full max-w-md`}>
                            <div className="absolute top-4 right-4">
                                <button
                                    onClick={toggleDarkMode}
                                    className={`p-2 rounded-lg ${darkMode ? 'bg-gray-700 text-yellow-400' : 'bg-gray-100 text-gray-600'} hover:opacity-80 transition`}
                                >
                                    {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                                </button>
                            </div>
                            
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl mx-auto mb-4 flex items-center justify-center">
                                    <Database className="w-8 h-8 text-white" />
                                </div>
                                <h1 className={`text-3xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'} mb-2`}>DeepSearch AI</h1>
                                <p className={darkMode ? 'text-gray-400' : 'text-gray-600'}>Intelligent AI for Deep Research</p>
                            </div>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className={`block text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'} mb-2`}>Email</label>
                                    <input
                                        type="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        onKeyPress={(e) => handleKeyPress(e, handleAuth)}
                                        className={`w-full px-4 py-3 rounded-lg border ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-gray-300'} focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition`}
                                        placeholder="you@example.com"
                                    />
                                </div>
                                
                                <div>
                                    <label className={`block text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'} mb-2`}>Password</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        onKeyPress={(e) => handleKeyPress(e, handleAuth)}
                                        className={`w-full px-4 py-3 rounded-lg border ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-gray-300'} focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition`}
                                        placeholder="••••••••"
                                    />
                                </div>
                                
                                <button
                                    onClick={handleAuth}
                                    disabled={loading}
                                    className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-medium hover:from-indigo-700 hover:to-purple-700 transition disabled:opacity-50"
                                >
                                    {loading ? 'Please wait...' : authMode === 'signin' ? 'Sign In' : 'Sign Up'}
                                </button>
                            </div>
                            
                            <button
                                onClick={() => setAuthMode(authMode === 'signin' ? 'signup' : 'signin')}
                                className="w-full mt-4 text-indigo-600 hover:text-indigo-700 font-medium"
                            >
                                {authMode === 'signin' ? 'Need an account? Sign up' : 'Already have an account? Sign in'}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-50'}`}>
                    <div className={`${sidebarOpen ? 'w-80' : 'w-0'} ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border-r transition-all duration-300 overflow-hidden flex flex-col`}>
                        <div className={`p-6 ${darkMode ? 'border-gray-700' : 'border-gray-200'} border-b`}>
                            <div className="flex items-center justify-between mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center">
                                        <Database className="w-5 h-5 text-white" />
                                    </div>
                                    <h1 className={`text-xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'}`}>DeepSearch</h1>
                                </div>
                                <button
                                onClick={handleLogout}
                                className="flex items-center gap-2 text-gray-400 hover:text-gray-600"
                                >
                                <LogOut className="w-5 h-5" />
                                <span className="font-medium">Logout</span>
                                </button>
                            </div>
                            
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={newStoreName}
                                    onChange={(e) => setNewStoreName(e.target.value)}
                                    onKeyPress={(e) => handleKeyPress(e, createStore)}
                                    placeholder="New store name"
                                    className={`flex-1 px-3 py-2 rounded-lg border ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'border-gray-300'} text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none`}
                                />
                                <button
                                    onClick={createStore}
                                    disabled={loading}
                                    className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition disabled:opacity-50"
                                >
                                    <Plus className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4">
                            <h2 className={`text-xs font-semibold ${darkMode ? 'text-gray-400' : 'text-gray-500'} uppercase tracking-wider mb-3`}>Your Stores</h2>
                            <div className="space-y-2">
                                {stores.map((store) => (
                                    <div
                                        key={store.resource_name}
                                        className={`p-3 rounded-lg cursor-pointer transition ${
                                            selectedStore?.resource_name === store.resource_name
                                                ? darkMode ? 'bg-indigo-900 border border-indigo-700' : 'bg-indigo-50 border border-indigo-200'
                                                : darkMode ? 'hover:bg-gray-700 border border-transparent' : 'hover:bg-gray-50 border border-transparent'
                                        }`}
                                    >
                                        <div className="flex items-center justify-between" onClick={() => selectStore(store)}>
                                            <div className="flex items-center gap-2 flex-1 min-w-0">
                                                <Database className="w-4 h-4 text-indigo-600 flex-shrink-0" />
                                                <span className={`text-sm font-medium ${darkMode ? 'text-white' : 'text-gray-900'} truncate`}>{store.display_name}</span>
                                            </div>
                                            <button
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    deleteStore(store.display_name);
                                                }}
                                                className={`${darkMode ? 'text-gray-500 hover:text-red-400' : 'text-gray-400 hover:text-red-600'} p-1`}
                                            >
                                                <Trash2 className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col">
                        <div className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border-b px-6 py-4 flex items-center gap-4`}>
                            <button
                                onClick={() => setSidebarOpen(!sidebarOpen)}
                                className={darkMode ? 'text-gray-400 hover:text-gray-300' : 'text-gray-400 hover:text-gray-600'}
                            >
                                {sidebarOpen ? <X className="w-5 h-5" /> : <Menu className="w-5 h-5" />}
                            </button>
                            
                            {user && (
                                <div className="flex-1">
                                <h2 className={`text-md font-semibold ${darkMode ? 'text-white' : 'text-gray-900'}`}>
                                Hello {user.email.split("@")[0]}!
                                </h2>

                                    {selectedStore && (
                                        <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                            {selectedStore.display_name} • {documents.length} documents
                                        </p>
                                    )}
                                </div>
                            )}
                            
                            <button
                                onClick={toggleDarkMode}
                                className={`p-2 rounded-lg ${darkMode ? 'bg-gray-700 text-yellow-400' : 'bg-gray-100 text-gray-600'} hover:opacity-80 transition`}
                            >
                                {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                            </button>
                            
                            {selectedStore && (
                                <label className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition cursor-pointer flex items-center gap-2">
                                    <Upload className="w-4 h-4" />
                                    <span>{uploadProgress ? 'Uploading...' : 'Upload File'}</span>
                                    <input type="file" onChange={uploadFile} className="hidden" disabled={uploadProgress} />
                                </label>
                            )}
                        </div>

                        <div className="flex-1 overflow-auto">
                            {!selectedStore ? (
                                <div className={`flex items-center justify-center h-full ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>
                                    <div className="text-center">
                                        <Database className="w-16 h-16 mx-auto mb-4 opacity-50" />
                                        <p className="text-lg">Select or create a store to get started</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="p-6 max-w-5xl mx-auto">
                                    <div className="mb-8">
                                        <div className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} rounded-xl shadow-sm border p-4`}>
                                            <div className="flex gap-3">
                                                <input
                                                    type="text"
                                                    value={query}
                                                    onChange={(e) => setQuery(e.target.value)}
                                                    onKeyPress={(e) => handleKeyPress(e, handleQuery)}
                                                    placeholder="Ask a question about your documents..."
                                                    className={`flex-1 px-4 py-3 rounded-lg border ${darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'border-gray-300'} focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none`}
                                                />
                                                <button
                                                    onClick={handleQuery}
                                                    disabled={loading}
                                                    className="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg font-medium hover:from-indigo-700 hover:to-purple-700 transition disabled:opacity-50 flex items-center gap-2"
                                                >
                                                    <Search className="w-4 h-4" />
                                                    Search
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {queryResult && (
                                        <div className={`mb-8 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} rounded-xl shadow-sm border p-6`}>
                                            <h3 className={`text-lg font-semibold ${darkMode ? 'text-white' : 'text-gray-900'} mb-4`}>Answer</h3>
                                            <div 
                                                className={`markdown-content ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}
                                                dangerouslySetInnerHTML={{ __html: marked.marked ? marked.marked(queryResult) : marked(queryResult) }}
                                            />
                                        </div>
                                    )}

                                    <div className={`${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} rounded-xl shadow-sm border`}>
                                        <div className={`p-4 ${darkMode ? 'border-gray-700' : 'border-gray-200'} border-b`}>
                                            <h3 className={`text-lg font-semibold ${darkMode ? 'text-white' : 'text-gray-900'}`}>Documents</h3>
                                        </div>
                                        <div className={`divide-y ${darkMode ? 'divide-gray-700' : 'divide-gray-200'}`}>
                                            {documents.length === 0 ? (
                                                <div className={`p-8 text-center ${darkMode ? 'text-gray-500' : 'text-gray-400'}`}>
                                                    <FileText className="w-12 h-12 mx-auto mb-3 opacity-50" />
                                                    <p>No documents yet. Upload files to get started.</p>
                                                </div>
                                            ) : (
                                                documents.map((doc) => (
                                                    <div key={doc.resource_name} className={`p-4 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'} transition flex items-center justify-between`}>
                                                        <div className="flex items-center gap-3 flex-1 min-w-0">
                                                            <FileText className="w-5 h-5 text-indigo-600 flex-shrink-0" />
                                                            <div className="min-w-0 flex-1">
                                                                <p className={`text-sm font-medium ${darkMode ? 'text-white' : 'text-gray-900'} truncate`}>{doc.display_name}</p>
                                                                <p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>{doc.mime_type}</p>
                                                            </div>
                                                        </div>
                                                        <button
                                                            onClick={() => deleteDocument(doc.resource_name)}
                                                            className={`${darkMode ? 'text-gray-500 hover:text-red-400' : 'text-gray-400 hover:text-red-600'} p-2`}
                                                        >
                                                            <Trash2 className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
